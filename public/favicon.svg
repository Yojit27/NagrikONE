<svg xmlns="http://www.w3.org/2000/svg" viewBox="200 120 600 550" width="100%" height="100%">
  <defs>
    <linearGradient id="pinOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d70e2" />
      <stop offset="50%" stop-color="#0e4b9e" />
      <stop offset="100%" stop-color="#08275c" />
    </linearGradient>
    <linearGradient id="mapLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
