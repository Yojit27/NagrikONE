        <rect x="378" y="270" width="32" height="150" rx="2" />
        <rect x="390" y="248" width="6" height="22" />
        <rect x="395" y="260" width="30" height="8" />
        <rect x="413" y="250" width="38" height="170" rx="2" />
        <rect x="425" y="225" width="8" height="25" />
        <rect x="455" y="215" width="45" height="205" rx="2" />
        <rect x="470" y="190" width="12" height="25" />
        <rect x="475" y="175" width="3" height="15" />
        <rect x="463" y="235" width="28" height="6" fill="#0a2558" opacity="0.8" />
        <rect x="504" y="235" width="40" height="185" rx="2" />
        <rect x="520" y="210" width="6" height="25" />
        <rect x="548" y="255" width="34" height="165" rx="2" />
        <rect x="585" y="275" width="28" height="145" rx="2" />
        <rect x="615" y="310" width="25" height="110" rx="2" />
